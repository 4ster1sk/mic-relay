name: Build & Release Mic Relay

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build headers for vet/test
        run: |
          sudo chmod 1777 /tmp
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get -o APT::Sandbox::User=root update
          sudo apt-get -o APT::Sandbox::User=root install -y pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Run go vet & tests
        run: |
          go vet ./...
          go test -v -race ./...

  build-linux-deb:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: golang:1.24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian 12 build dependencies
        run: |
          chmod 1777 /tmp
          rm -rf /var/lib/apt/lists/*
          apt-get -o APT::Sandbox::User=root update
          apt-get -o APT::Sandbox::User=root install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev dpkg-dev ca-certificates

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0+git.$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build Linux amd64 binary (Debian 12 glibc 2.36 compatible)
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/mic-relay ./cmd/mic-relay

      - name: Build Debian 12+ .deb package
        run: |
          chmod +x ./packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh "${{ steps.ver.outputs.version }}" dist/mic-relay dist/
          dpkg-deb --info dist/mic-relay_*_amd64.deb

      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@v3
        with:
          name: mic-relay-linux-deb
          path: dist/mic-relay_*_amd64.deb

  build-windows-exe:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install MinGW-w64 cross-compiler
        run: |
          sudo chmod 1777 /tmp
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get -o APT::Sandbox::User=root update
          sudo apt-get -o APT::Sandbox::User=root install -y gcc-mingw-w64-x86-64

      - name: Build Windows amd64 .exe
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/mic-relay.exe ./cmd/mic-relay

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v3
        with:
          name: mic-relay-windows-exe
          path: dist/mic-relay.exe

  release:
    needs: [build-linux-deb, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux .deb
        uses: actions/download-artifact@v3
        with:
          name: mic-relay-linux-deb
          path: release-assets

      - name: Download Windows .exe
        uses: actions/download-artifact@v3
        with:
          name: mic-relay-windows-exe
          path: release-assets

      - name: Create Gitea Release and upload assets
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESP=$(curl -fsSL -X POST "${API_URL}/repos/${REPO}/releases" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Mic Relay ${TAG}\",\"body\":\"Linux (Debian 12+ .deb) および Windows (.exe) ビルド\"}")
          RELEASE_ID=$(printf '%s' "${RESP}" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")

          for f in release-assets/*; do
            fname=$(basename "$f")
            encoded_name=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))" "$fname")
            echo "Uploading ${fname}..."
            curl -fsSL -X POST "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${encoded_name}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${f}" > /dev/null
          done
